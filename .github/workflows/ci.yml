name: CI - Validation

# Called by deploy.yml for PRs, stage/main pushes, and manual deploys.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Job 1: Quick validation (unit tests + build + coverage)
  validate:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    name: Unit Tests, Coverage & Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm first so setup-node can find it and cache the pnpm store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        run: pnpm run lint

      - name: Run Unit Tests with Coverage
        run: pnpm run test:coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Coverage Summary
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: TypeScript Check
        run: pnpm run typecheck

      - name: Build Project
        run: pnpm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: dist/
          retention-days: 1
