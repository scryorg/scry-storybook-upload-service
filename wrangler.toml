# In wrangler.toml

# A user-friendly name for the Worker service.
name = "storybook-deployment-service"

# The entry point file for the Worker.
main = "src/entry.worker.ts"

# Specifies the version of the Workers runtime APIs to use.
# Updated to 2024-09-23 for automatic Node.js built-in module resolution
compatibility_date = "2024-09-23"

# Enable Node.js compatibility for packages like 'stream'
compatibility_flags = ["nodejs_compat"]

# Development server configuration
[dev]
ip = "0.0.0.0"  # Bind to all network interfaces instead of just localhost
port = 8787

# Defines the bindings to other Cloudflare resources.
[[r2_buckets]]
# The variable name used to access the binding in the code (c.env.STORYBOOK_BUCKET).
binding = "STORYBOOK_BUCKET"
# The name of the actual R2 bucket in the Cloudflare dashboard.
bucket_name = "my-storybooks-production"
# For local development, a preview bucket can be specified.
preview_bucket_name = "my-storybooks-staging"

[[queues.producers]]
queue = "scry-build-processing"
binding = "BUILD_PROCESSING_QUEUE"

# --- Environment Variables and Secrets ---
# The following variables are required for the S3-compatible API to work.
# For local development with `wrangler dev`, you can define them in this `.dev.vars` file.
# For production, you must set these as secrets using the `wrangler secret put` command.
# Example: `wrangler secret put R2_ACCOUNT_ID`

[vars]
SCRY_ENV = "production"
# Non-sensitive configuration values
# NOTE: R2_ACCOUNT_ID is set via secrets for security (even though it's not highly sensitive)
R2_BUCKET_NAME = "my-storybooks-production"

# IMPORTANT: The following secrets MUST be set via `wrangler secret put`:
# - R2_ACCOUNT_ID (your Cloudflare account ID)
# - R2_S3_ACCESS_KEY_ID (32-character access key ID)
# - R2_S3_SECRET_ACCESS_KEY (secret access key)
# - FIREBASE_PROJECT_ID
# - FIREBASE_CLIENT_EMAIL
# - FIREBASE_PRIVATE_KEY
# - SCRY_UPLOAD_ASSERTION_SECRET (optional; enables the dashboard's signed second door on the two bundle routes.
#   Unset it to switch the door off. See README "Dashboard import door".)
# - CLEANUP_TOKEN (required to enable DELETE /cleanup/:project/:version)
# - SENTRY_DSN (Sentry Data Source Name for error tracking)
#
# DO NOT add placeholder values here - they will override secrets!

# Explicit production key; keep the top-level production target for compatibility.
# Bindings and vars are not inherited by named environments.
[env.production]
name = "storybook-deployment-service"

[env.production.vars]
R2_BUCKET_NAME = "my-storybooks-production"
SCRY_ENV = "production"

# Orphan-bundle sweep (ledger F80): a bundle build's presigned-url call creates its Firestore
# document immediately, before any bytes move; if the client's later `/bundle/complete` call never
# arrives (crash mid-upload, dropped network, abandoned CLI run) nothing else ever revisits that
# document again. Hourly against a 60-minute age threshold (src/bundle/orphan-sweep.ts) gives
# worst-case detection within about 2 hours. Ledger F91 (cs-rev-39 security review): originally
# every 15 minutes, four checks inside one 60-minute threshold window is redundant, and repeating a
# burst of Firestore queries that often — against a project sitting at low steady-state traffic,
# straight after any quiet period when Firestore's per-project ramp-up allowance has decayed back
# down — is exactly the pattern that triggered F86's sustained 429s. Hourly cuts both the read total
# and the burst frequency, on top of the query itself now being one collection-group read instead of
# a per-project scan (see `findOrphanBundleCandidates` in firestore.worker.ts).
# Declared per environment, not once at the top level: per this file's own convention above,
# bindings and vars are not inherited by named environments here, and a cron silently missing from
# one environment is exactly the kind of drift that convention exists to avoid.
[env.production.triggers]
crons = ["0 * * * *"]

[[env.production.r2_buckets]]
binding = "STORYBOOK_BUCKET"
bucket_name = "my-storybooks-production"
preview_bucket_name = "my-storybooks-staging"

[[env.production.queues.producers]]
queue = "scry-build-processing"
binding = "BUILD_PROCESSING_QUEUE"

# Staging environment for pushes to stage; retain the existing Worker name.
[env.staging]
name = "storybook-deployment-service-preview"

[env.staging.vars]
R2_BUCKET_NAME = "my-storybooks-staging"
SCRY_ENV = "staging"

# Orphan-bundle sweep (ledger F80/F91) — see the matching comment under [env.production.triggers].
[env.staging.triggers]
crons = ["0 * * * *"]

[[env.staging.r2_buckets]]
binding = "STORYBOOK_BUCKET"
bucket_name = "my-storybooks-staging"
preview_bucket_name = "my-storybooks-staging"

[[env.staging.queues.producers]]
queue = "scry-build-processing-staging"
binding = "BUILD_PROCESSING_QUEUE"

# Schema-v1 log lines are shipped to the central R2 store by the scry-logs tail consumer
# (log-standardization): staging ships to scry-logs-staging, production to scry-logs.
[[env.staging.tail_consumers]]
service = "scry-logs-staging"

[[env.production.tail_consumers]]
service = "scry-logs"
# The processing consumer owns retries and DLQ scry-build-processing-staging-dlq.

# Observability and Logging Configuration
[observability]
[observability.logs]
enabled = true  # Enable logging
head_sampling_rate = 1  # Sample 100% of requests
invocation_logs = true  # Log function invocations
persist = true  # Persist logs for analysis
